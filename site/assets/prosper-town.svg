<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="town-title town-desc">
  <title id="town-title">Le quartier général de Prosper dans une ville du Benelux</title>
  <desc id="town-desc">Trois façades accueillantes, un commerce, un cabinet vétérinaire, un canal et son pont, des arbres et des chemins piétons. Le décor laisse la place à l’équipe animée.</desc>
  <metadata>Original editable vector scenery for Prosper et les prospects. Material palette inspired by Oscar et les Agents, Copyright 2026 Renaud, MIT. No external resources and no embedded people.</metadata>
  <defs>
    <linearGradient id="town-sky" x2="0" y2="1"><stop stop-color="#e8ede1"/><stop offset="1" stop-color="#f5f4ec"/></linearGradient>
    <linearGradient id="town-glass" x2="0" y2="1"><stop stop-color="#bfd6d4"/><stop offset="1" stop-color="#dce5d7"/></linearGradient>
    <linearGradient id="town-water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfd6d4"/><stop offset=".65" stop-color="#a7c3bd"/><stop offset="1" stop-color="#91afa5"/></linearGradient>
    <linearGradient id="town-wood" x2="0" y2="1"><stop stop-color="#e9ddc6"/><stop offset="1" stop-color="#d8c8a8"/></linearGradient>
    <pattern id="town-paving" width="86" height="42" patternUnits="userSpaceOnUse"><path d="M0 42H86M86 0V42M43 0V21" fill="none" stroke="#d5d6c8" stroke-width=".8"/></pattern>
